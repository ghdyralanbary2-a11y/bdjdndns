name: Build Levi AI
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Write app
        run: |
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>ليفاي</title>
          <style>
          *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
          body{background:linear-gradient(160deg,#0f0c29,#1b1245 50%,#24243e);color:#fff;font:16px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}
          header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,.07);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.1)}
          .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff6ec4,#7873f5,#27d3c3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;box-shadow:0 0 14px #7873f5aa}
          .info{flex:1}
          .info b{font-size:18px;display:block}
          .info small{color:#7dffb0;font-size:13px}
          .info small:before{content:"";display:inline-block;width:8px;height:8px;background:#2dff7a;border-radius:50%;margin-left:5px}
          header button{background:rgba(255,255,255,.1);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px}
          #chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
          .row{display:flex;gap:8px;align-items:flex-end;max-width:90%}
          .row.bot{align-self:flex-start}
          .row.me{align-self:flex-end;flex-direction:row-reverse}
          .mini{width:30px;height:30px;flex:none;font-size:14px;box-shadow:none}
          .m{padding:10px 14px;border-radius:18px;white-space:pre-wrap;line-height:1.7;word-wrap:break-word;overflow-wrap:anywhere}
          .bot .m{background:rgba(255,255,255,.12);border-bottom-right-radius:4px}
          .me .m{background:linear-gradient(135deg,#ff6ec4,#7873f5);border-bottom-left-radius:4px}
          pre{background:#0a0820;padding:10px;border-radius:10px;overflow-x:auto;margin:6px 0;white-space:pre;direction:ltr;text-align:left}
          code{font-family:monospace;font-size:14px}
          .dots span{display:inline-block;width:8px;height:8px;margin:0 2px;background:#fff;border-radius:50%;animation:b 1s infinite}
          .dots span:nth-child(2){animation-delay:.15s}
          .dots span:nth-child(3){animation-delay:.3s}
          @keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-5px)}}
          #bar{display:flex;gap:8px;padding:10px;background:rgba(255,255,255,.07);padding-bottom:max(10px,env(safe-area-inset-bottom))}
          #in{flex:1;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:22px;padding:12px 16px;font:inherit;resize:none;max-height:120px;outline:none}
          #in::placeholder{color:#ffffff88}
          #go{background:linear-gradient(135deg,#ff6ec4,#7873f5);color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:20px}
          </style>
          </head>
          <body>
          <header>
            <div class="av">L</div>
            <div class="info"><b>ليفاي</b><small>متصل الآن</small></div>
            <button id="clr">🗑️</button>
          </header>
          <div id="chat"></div>
          <div id="bar"><textarea id="in" rows="1" placeholder="اكتب لليفاي..."></textarea><button id="go">➤</button></div>
          <script>
          var $=function(s){return document.querySelector(s)};
          var SYS="أنت ليفاي، شاب عراقي ودود وذكي وخفيف دم. تحچي باللهجة العراقية البسيطة وتجاوب بوضوح واختصار، وتساعد بأي شي: دراسة، برمجة، ترجمة، أفكار، وأمور الحياة اليومية. إذا المستخدم كتب بلغة ثانية رد بلغته. إذا سألك بجدية إذا انت ذكاء اصطناعي، قله الحقيقة.";
          var hist=[];try{hist=JSON.parse(localStorage.getItem("levi")||"[]")}catch(e){}
          var busy=false;
          function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
          function md(t){return esc(t).replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,"<pre><code>$2</code></pre>").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
          function add(role,html){
            var r=document.createElement("div");r.className="row "+(role==="user"?"me":"bot");
            r.innerHTML=(role==="user"?"":'<div class="av mini">L</div>')+'<div class="m">'+html+"</div>";
            $("#chat").appendChild(r);$("#chat").scrollTop=1e9;return r.querySelector(".m");
          }
          function save(){localStorage.setItem("levi",JSON.stringify(hist.slice(-40)))}
          function hello(){add("assistant","هلا بيك! آني ليفاي 👋 شنو تحتاج اليوم؟")}
          hist.forEach(function(m){add(m.role,md(m.content))});
          if(!hist.length)hello();
          $("#clr").onclick=function(){hist=[];save();$("#chat").innerHTML="";hello()};
          async function send(){
            var text=$("#in").value.trim();
            if(!text||busy)return;
            busy=true;$("#in").value="";
            hist.push({role:"user",content:text});add("user",md(text));
            var el=add("assistant",'<span class="dots"><span></span><span></span><span></span></span>');
            try{
              var r=await fetch("https://text.pollinations.ai/openai",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({model:"openai",messages:[{role:"system",content:SYS}].concat(hist.slice(-20))})
              });
              if(!r.ok)throw new Error("خطأ "+r.status);
              var j=await r.json();
              var out=(j.choices&&j.choices[0]&&j.choices[0].message.content)||"";
              if(!out)throw new Error("ما وصل رد");
              el.innerHTML=md(out);
              hist.push({role:"assistant",content:out});save();
            }catch(e){
              el.textContent="⚠️ صار خطأ بالاتصال، تأكد من الإنترنت وجرب مرة ثانية.";
              hist.pop();save();
            }
            $("#chat").scrollTop=1e9;busy=false;
          }
          $("#go").onclick=send;
          </script>
          </body>
          </html>
          EOF
      - name: Build APK
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Levi AI" com.levi.ai --web-dir=www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Levi-AI
          path: android/app/build/outputs/apk/debug/app-debug.apk
